name: Deploy Blog

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *" # 每天 UTC 0 点（北京时间 8 点）重建，刷新贡献日历
  workflow_dispatch: # 允许在 Actions 页面手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 建站时间线需要完整的 Git 历史
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Refresh build timeline
        run: node tools/timeline.mjs
      - name: Refresh GitHub contributions
        run: node tools/contributions.mjs ${{ github.repository_owner }}
      - name: Build
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4